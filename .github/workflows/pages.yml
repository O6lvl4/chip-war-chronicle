name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  CODOPSY_REV: fabfbdc

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # codopsy v2.2.0 (最新リリース) は TypeScript の型 import を未使用と誤検出する。
      # 修正 (5626620) は main にのみ入っているので、そのリビジョンをソースからビルドして使う。
      - name: Restore codopsy
        id: codopsy-cache
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/codopsy
          key: codopsy-${{ env.CODOPSY_REV }}-${{ runner.os }}
      - uses: dtolnay/rust-toolchain@stable
        if: steps.codopsy-cache.outputs.cache-hit != 'true'
      - name: Build codopsy from source
        if: steps.codopsy-cache.outputs.cache-hit != 'true'
        run: cargo install --git https://github.com/O6lvl4/codopsy --rev ${{ env.CODOPSY_REV }} --locked codopsy
      - name: Quality gate (codopsy)
        run: ~/.cargo/bin/codopsy analyze ./src --fail-on-warning
      - name: Build
        run: pnpm build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
